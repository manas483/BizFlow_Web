name: bizflow_mobile
description: BizFlow Mobile — Enterprise business management on the go.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Networking
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^13.0.0

  # JSON / Serialization
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1

  # Barcode Scanner
  mobile_scanner: ^5.1.1

  # Charts
  fl_chart: ^0.68.0

  # Image Caching
  cached_network_image: ^3.3.1

  # Shimmer Loading
  shimmer: ^3.0.0

  # Google Fonts (Inter)
  google_fonts: ^6.1.0

  # Connectivity
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/animations/
