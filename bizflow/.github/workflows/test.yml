name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks-action
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    name: Unit Tests
    needs: [secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Unit Tests
        run: pnpm test:unit
        working-directory: ./apps/web
      - name: Upload Coverage Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 14

  api-tests:
    name: API Tests
    needs: [secret-scan]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: bizflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/bizflow_test?schema=public
      NEXTAUTH_SECRET: test-secret-minimum-32-characters-for-ci
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: DB Setup
        working-directory: ./apps/web
        run: |
          npx prisma db push --skip-generate
          npx prisma generate
      - name: Install Playwright
        working-directory: ./apps/web
        run: npx playwright install chromium --with-deps
      - name: Run API Tests
        working-directory: ./apps/web
        run: pnpm test:api
      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  e2e-tests:
    name: E2E Tests
    needs: [unit-tests, api-tests]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: bizflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/bizflow_test?schema=public
      NEXTAUTH_SECRET: test-secret-minimum-32-characters-for-ci
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: DB Setup
        working-directory: ./apps/web
        run: |
          npx prisma db push --skip-generate
          npx prisma generate
      - name: Install Playwright
        working-directory: ./apps/web
        run: npx playwright install chromium --with-deps
      - name: Run E2E Tests
        working-directory: ./apps/web
        run: pnpm test:e2e
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: apps/web/test-results/
          retention-days: 14

  migration-safety:
    name: Migration Safety Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Migration Scanner
        working-directory: ./apps/web
        run: npx tsx scripts/validate-migration.ts

  type-check-and-build:
    name: Type Check & Build
    needs: [unit-tests, api-tests]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/bizflow_test?schema=public
      NEXTAUTH_SECRET: test-secret-minimum-32-characters-for-ci
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Prisma Generate
        working-directory: ./apps/web
        run: npx prisma generate
      - name: Type Check
        run: pnpm turbo run typecheck
      - name: Lint
        run: pnpm turbo run lint
      - name: Build
        run: pnpm turbo run build
      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: .next/
          retention-days: 14

  preflight:
    name: Preflight Checks
    needs: [type-check-and-build, e2e-tests, migration-safety]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/bizflow_test?schema=public
      NEXTAUTH_SECRET: test-secret-minimum-32-characters-for-ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: bizflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: DB Setup
        working-directory: ./apps/web
        run: |
          npx prisma db push --skip-generate
          npx prisma generate
      - name: Run Preflight
        working-directory: ./apps/web
        run: pnpm preflight
