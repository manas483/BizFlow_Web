version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bizflow_test_db
    environment:
      POSTGRES_USER: bizflow
      POSTGRES_PASSWORD: bizflow_pass
      POSTGRES_DB: bizflow_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizflow -d bizflow_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
